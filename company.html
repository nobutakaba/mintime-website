<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社情報 — Mintime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-primary: #2dba8a;
      --green-light: #45d4a2;
      --green-pale: #e0f8f1;
      --green-dark: #1a7a5e;
      --accent: #00c878;
      --text-dark: #111827;
      --text-mid: #374151;
      --text-soft: #6b7280;
      --bg-base: #f4fcf9;
      --bg-white: #ffffff;
      --border: #c2edd8;
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 8px;
      --font-display: 'DM Sans', 'Noto Sans JP', sans-serif;
      --font-body: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background-color: var(--bg-base); color: var(--text-dark); line-height: 1.7; }
    img { max-width: 100%; height: auto; display: block; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    header { position: sticky; top: 0; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    nav { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 68px; }
    .nav-logo img { height: 52px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-mid); padding: 8px 14px; border-radius: var(--radius-sm); transition: color 0.2s, background 0.2s; }
    .nav-links a:hover { color: var(--green-primary); background: var(--green-pale); }
    .nav-cta { display: inline-flex; align-items: center; gap: 6px; background: var(--green-primary); color: #fff !important; padding: 10px 22px; border-radius: 50px; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.02em; transition: background 0.2s, transform 0.15s; box-shadow: 0 2px 12px rgba(45,186,138,0.3); }
    .nav-cta:hover { background: var(--green-light); transform: translateY(-1px); }

    /* PAGE */
    .page-header {
      background: linear-gradient(135deg, #1a7a5e 0%, #2aaa84 50%, #1a7a5e 100%);
      padding: 64px 24px 48px;
      text-align: center;
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .company-section {
      max-width: 900px;
      margin: 64px auto;
      padding: 0 24px 80px;
    }
    .company-image {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .company-image img {
      width: 100%;
      display: block;
    }

    @media (max-width: 600px) {
      nav { padding: 0 16px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="mintime2.html" class="nav-logo"><img src="ロゴ_字あり.png" alt="Mintimeロゴ"></a>
      <ul class="nav-links">
        <li><a href="mintime2.html#about">電子カルテ</a></li>
        <li><a href="mintime2.html#generative-ai">生成AI</a></li>
        <li><a href="mintime2.html#stats-ai">統計AI</a></li>
        <li><a href="mintime2.html#faq">FAQ</a></li>
        <li><a href="company.html" style="color: var(--green-primary); font-weight:700;">会社情報</a></li>
      </ul>
      <a href="mintime2.html#trial" class="nav-cta">▶ 無料トライアル</a>
    </nav>
  </header>

  <div class="page-header">
    <h1>会社情報</h1>
  </div>

  <div class="company-section">
    <div class="company-image">
      <img src="会社情報.png" alt="会社情報">
    </div>
  </div>

</body>
</html>
