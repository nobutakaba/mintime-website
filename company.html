<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社情報 — Mintime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-primary: #2dba8a;
      --green-light: #45d4a2;
      --green-pale: #e0f8f1;
      --green-dark: #1a7a5e;
      --accent: #00c878;
      --text-dark: #111827;
      --text-mid: #374151;
      --bg-base: #f4fcf9;
      --bg-white: #ffffff;
      --border: #c2edd8;
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 8px;
      --font-display: 'DM Sans', 'Noto Sans JP', sans-serif;
      --font-body: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background-color: var(--bg-base); color: var(--text-dark); line-height: 1.7; }
    img { max-width: 100%; height: auto; display: block; }
    a { text-decoration: none; color: inherit; }

    header { position: sticky; top: 0; z-index: 200; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    nav { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 68px; position: relative; flex-wrap: wrap; }
    .nav-logo img { height: 52px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-mid); padding: 8px 14px; border-radius: var(--radius-sm); transition: color 0.2s, background 0.2s; }
    .nav-links a:hover { color: var(--green-primary); background: var(--green-pale); }
    .nav-links a.active { color: var(--green-primary); font-weight: 700; }
    .nav-cta { display: inline-flex; align-items: center; gap: 6px; background: var(--green-primary); color: #fff !important; padding: 10px 22px; border-radius: 50px; font-size: 0.88rem; font-weight: 700; transition: background 0.2s, transform 0.15s; box-shadow: 0 2px 12px rgba(45,186,138,0.3); white-space: nowrap; }
    .nav-cta:hover { background: var(--green-light); transform: translateY(-1px); }

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; cursor: pointer; background: none; border: none; padding: 6px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-dark); border-radius: 2px; transition: transform 0.3s, opacity 0.3s; }

    @media screen and (max-width: 900px) {
      nav { flex-wrap: wrap; height: auto; min-height: 68px; padding: 0 16px; }
      .hamburger { display: flex; order: 2; margin-left: auto; margin-right: 8px; }
      .nav-cta { order: 2; font-size: 0.78rem; padding: 8px 12px; }
      .nav-logo { order: 1; padding: 8px 0; }
      .nav-links {
        order: 3;
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 8px 0 16px;
        gap: 0;
      }
      .nav-links li { width: 100%; }
      .nav-links a { display: block; padding: 14px 24px; font-size: 1rem; border-radius: 0; border-bottom: 1px solid var(--green-pale); }
      #nav-toggle:checked ~ .nav-links { display: flex; }
      #nav-toggle:checked ~ label.hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      #nav-toggle:checked ~ label.hamburger span:nth-child(2) { opacity: 0; }
      #nav-toggle:checked ~ label.hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    }

    .page-header {
      background: linear-gradient(135deg, #1a7a5e 0%, #2aaa84 50%, #1a7a5e 100%);
      padding: 64px 24px 48px;
      text-align: center;
    }
    .page-header h1 { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; color: #fff; letter-spacing: -0.02em; }

    .company-section { max-width: 900px; margin: 64px auto; padding: 0 24px 80px; }
    .company-image { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-lg); }
    .company-image img { width: 100%; display: block; }

    /* ── Language switcher ── */
    .lang-switcher { display: inline-flex; align-items: center; background: var(--green-pale); border: 1px solid var(--border); border-radius: 50px; padding: 3px; gap: 2px; margin-right: 8px; }
    .lang-btn { padding: 5px 13px; border-radius: 50px; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; border: none; background: transparent; color: var(--text-soft, #6b7280); transition: background 0.2s, color 0.2s; font-family: var(--font-display); }
    .lang-btn.active { background: var(--green-primary); color: #fff; }
    .lang-btn:hover:not(.active) { background: var(--border); color: var(--text-dark); }

    /* hide/show by language */
    .lang-en .ja { display: none !important; }
    .lang-ja .en { display: none !important; }
    /* ensure img tags with .en/.ja switch correctly */
    .lang-en img.en { display: block !important; }
    .lang-ja img.ja { display: block !important; }
  </style>
</head>
<script>
  function setLang(lang) {
    document.getElementById('body').className = 'lang-' + lang;
    document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
    try { localStorage.setItem('mintime-lang', lang); } catch(e) {}
  }
</script>
<body class="lang-ja" id="body">

  <header>
    <nav>
      <a href="index.html" class="nav-logo"><img src="ロゴ_字あり.png" alt="Mintimeロゴ"></a>
      <input type="checkbox" id="nav-toggle" style="display:none;">
      <label for="nav-toggle" class="hamburger" aria-label="メニュー">
        <span></span><span></span><span></span>
      </label>
      <div style="display:flex;align-items:center;gap:8px;order:2;margin-left:auto;">
        <div class="lang-switcher">
          <button class="lang-btn active" id="btn-ja" onclick="event.stopPropagation();setLang('ja')">JP</button>
          <button class="lang-btn" id="btn-en" onclick="event.stopPropagation();setLang('en')">EN</button>
        </div>
        <a href="index.html#trial" class="nav-cta" style="white-space: nowrap;">▶ <span class="ja">無料トライアル</span><span class="en">Free Trial</span></a>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html#about"><span class="ja">電子カルテ</span><span class="en">EMR</span></a></li>
        <li><a href="index.html#generative-ai"><span class="ja">生成AI</span><span class="en">Gen AI</span></a></li>
        <li><a href="index.html#stats-ai"><span class="ja">統計AI</span><span class="en">Stats AI</span></a></li>
        <li><a href="index.html#faq">FAQ</a></li>
        <li><a href="company.html" class="active"><span class="ja">会社情報</span><span class="en">About Us</span></a></li>
      </ul>
    </nav>
  </header>

  <div class="page-header">
    <h1><span class="ja">会社情報</span><span class="en">About Us</span></h1>
  </div>

  <div class="company-section">
    <div class="company-image">
      <img class="ja" src="会社情報.png" alt="会社情報">
      <img class="en" src="company-en.png" alt="Company Info">
    </div>
  </div>

  <script>
    function setLang(lang) {
      document.getElementById('body').className = 'lang-' + lang;
      document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
      try { localStorage.setItem('mintime-lang', lang); } catch(e) {}
    }
    // Restore saved preference
    try { const s = localStorage.getItem('mintime-lang'); if (s && s !== 'ja') setLang(s); } catch(e) {}

    // スクロール時ヘッダーに影をつける
    const header = document.querySelector('header');
    window.addEventListener('scroll', () => {
      header.style.boxShadow = window.scrollY > 10 ? '0 2px 20px rgba(45,186,138,0.12)' : 'none';
    });
  </script>
</body>
</html>
